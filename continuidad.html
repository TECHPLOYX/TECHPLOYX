<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TECHPLOYX | Continuidad</title>
<style>body{font:16px system-ui;margin:0;background:#f5f8fc;color:#172033}main{max-width:1100px;margin:0 auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{margin:0}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;box-shadow:0 4px 14px #1720330d}.top{display:flex;justify-content:space-between;gap:8px}.pill{border-radius:999px;padding:4px 9px;background:#e8f1ff;font-size:12px}.blocked{background:#fff0ed}.priority{font-weight:700;color:#325ee8}.label{font-size:12px;text-transform:uppercase;color:#667085;letter-spacing:.08em}li{margin:8px 0}.error{color:#b42318}</style>
</head>
<body><main><header><div><div class="label">TECHPLOYX</div><h1>Continuidad operativa</h1><p class="muted">Estado, prioridades, bloqueos y próximas acciones.</p></div><button id="refresh">Actualizar</button></header><p id="status" class="muted">Cargando…</p><section id="projects" class="grid"></section><h2>Historial reciente</h2><ul id="logs"></ul></main>
<script>
const status=document.querySelector('#status'),projects=document.querySelector('#projects'),logs=document.querySelector('#logs');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){status.textContent='Cargando…';try{const r=await fetch('/api/continuity',{credentials:'include'}),d=await r.json();if(!r.ok)throw Error(d.error||'No autorizado');projects.innerHTML=(d.projects||[]).map(p=>'<article class="'+(p.status==='blocked'?'blocked':'')+'"><div class="top"><strong>'+esc(p.name)+'</strong><span class="pill">'+esc(p.status)+'</span></div><p class="priority">Prioridad '+esc(p.priority)+'</p><div class="label">Enfoque</div><p>'+esc(p.current_focus||'Sin definir')+'</p><div class="label">Siguiente acción</div><p>'+esc(p.next_action||'Sin definir')+'</p>'+(p.blocked_reason?'<div class="label">Bloqueo</div><p class="error">'+esc(p.blocked_reason)+'</p>':'')+'</article>').join('');logs.innerHTML=(d.logs||[]).map(l=>'<li><strong>'+esc(l.project_code)+'</strong> · '+esc(l.type)+' · '+esc(l.message)+' <span class="muted">('+new Date(l.created_at).toLocaleString()+')</span></li>').join('')||'<li class="muted">Sin eventos registrados.</li>';status.textContent='Actualizado '+new Date().toLocaleString()}catch(e){status.textContent='No se pudo cargar Continuidad: '+e.message;status.className='error'}}
document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
