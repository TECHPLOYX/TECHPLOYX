name: TECHPLOYX PostgreSQL encrypted recovery backup
on:
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * *'
permissions:
  contents: read
concurrency:
  group: techployx-postgres-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.TECHPLOYX_POSTGRES_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.TECHPLOYX_BACKUP_PASSPHRASE }}
    steps:
      - name: Verify authorized backup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" || -z "${BACKUP_PASSPHRASE:-}" ]]; then
            echo "::error::Set TECHPLOYX_POSTGRES_URL and TECHPLOYX_BACKUP_PASSPHRASE in GitHub Actions Secrets."
            exit 1
          fi
          if [[ "${#BACKUP_PASSPHRASE}" -lt 24 ]]; then
            echo "::error::Encryption passphrase must contain at least 24 characters."
            exit 1
          fi
      - name: Export PostgreSQL 17 to transient runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/techployx-recovery"
          docker run --rm --network host \
            -e DATABASE_URL \
            -v "$RUNNER_TEMP/techployx-recovery:/backup" \
            postgres:17 \
            sh -ec 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/postgres.dump; pg_restore --list /backup/postgres.dump > /backup/toc.txt'
          test -s "$RUNNER_TEMP/techployx-recovery/postgres.dump"
          test -s "$RUNNER_TEMP/techployx-recovery/toc.txt"
      - name: Encrypt and checksum backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/techployx-recovery/postgres.dump" \
            -out "$RUNNER_TEMP/techployx-recovery/postgres.dump.enc" \
            -pass env:BACKUP_PASSPHRASE
          sha256sum "$RUNNER_TEMP/techployx-recovery/postgres.dump.enc" \
            | sed "s|$RUNNER_TEMP/techployx-recovery/||" \
            > "$RUNNER_TEMP/techployx-recovery/SHA256SUMS"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/techployx-recovery/postgres.dump.enc" \
            -out "$RUNNER_TEMP/techployx-recovery/roundtrip.dump" \
            -pass env:BACKUP_PASSPHRASE
          cmp "$RUNNER_TEMP/techployx-recovery/postgres.dump" \
            "$RUNNER_TEMP/techployx-recovery/roundtrip.dump"
          docker run --rm -v "$RUNNER_TEMP/techployx-recovery:/backup:ro" \
            postgres:17 pg_restore --list /backup/roundtrip.dump >/dev/null
          echo "Encrypted archive integrity verified. Database restore to isolated PostgreSQL remains a separate acceptance gate."
      - name: Remove plaintext before uploading
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/techployx-recovery/postgres.dump" \
                "$RUNNER_TEMP/techployx-recovery/roundtrip.dump" \
                "$RUNNER_TEMP/techployx-recovery/toc.txt"
      - name: Retain encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: techployx-encrypted-pg-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/techployx-recovery/postgres.dump.enc
            ${{ runner.temp }}/techployx-recovery/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

  restore_isolated:
    name: Restore encrypted backup in disposable PostgreSQL
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_PASSPHRASE: ${{ secrets.TECHPLOYX_BACKUP_PASSPHRASE }}
    steps:
      - name: Download encrypted artifact generated by this run
        uses: actions/download-artifact@v4
        with:
          name: techployx-encrypted-pg-${{ github.run_id }}
          path: ${{ runner.temp }}/techployx-restore-input
      - name: Verify checksum and decrypt only within transient runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/techployx-restore-input"
          sha256sum -c SHA256SUMS
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in postgres.dump.enc \
            -out postgres.dump \
            -pass env:BACKUP_PASSPHRASE
          docker run --rm -v "$PWD:/restore:ro" postgres:17 \
            pg_restore --list /restore/postgres.dump >/dev/null
      - name: Restore into PostgreSQL 17 isolated from production
        shell: bash
        run: |
          set -euo pipefail
          docker network create techployx-restore-isolated
          docker run -d --rm --name techployx-restore-db \
            --network techployx-restore-isolated \
            -e POSTGRES_PASSWORD=disposable-local-test-only \
            postgres:17 >/dev/null
          for attempt in $(seq 1 40); do
            if docker exec techployx-restore-db pg_isready -U postgres -q; then
              break
            fi
            sleep 1
          done
          docker exec techployx-restore-db pg_isready -U postgres -q
          # Bootstrap missing namespaces because schema filtering skips their creation.
          docker exec techployx-restore-db psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS techployx_ops; CREATE SCHEMA IF NOT EXISTS techployx_finance;"
          # This first test intentionally attempts the entire dump. Supabase-managed
          # roles/extensions may prevent a standalone upstream PostgreSQL restore.
          # Failure is evidence of a remaining recovery gap, not a production outage.
          # Restore only TECHPLOYX application schemas in a disposable vanilla
          # PostgreSQL instance. Supabase-managed extensions such as pg_cron
          # are excluded and require a separate full-platform recovery test.
          docker run --rm --network techployx-restore-isolated \
            -e PGPASSWORD=disposable-local-test-only \
            -v "$RUNNER_TEMP/techployx-restore-input:/restore:ro" \
            postgres:17 \
            pg_restore --exit-on-error --no-owner --no-acl \
              --schema=public --schema=techployx_ops --schema=techployx_finance \
              --host techployx-restore-db --username postgres \
              --dbname postgres /restore/postgres.dump
          docker exec techployx-restore-db psql -U postgres -Atq \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_schema IN ('public', 'techployx_ops', 'techployx_finance');" \
            | grep -Eq '^[1-9][0-9]*$'
          echo "TECHPLOYX application-schema restore validated; Supabase extensions, auth, roles and object storage are NOT validated."
      - name: Remove decrypted input and disposable database
        if: always()
        shell: bash
        run: |
          docker rm -f techployx-restore-db >/dev/null 2>&1 || true
          docker network rm techployx-restore-isolated >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/techployx-restore-input/postgres.dump"
