name: TECHPLOYX continuity check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public TECHPLOYX website
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://techployx.com/ -o /dev/null
      - name: Report deployment integration status
        env:
          APPDEPLOY_API_TOKEN: ${{ secrets.APPDEPLOY_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "${APPDEPLOY_API_TOKEN}" ]; then
            echo "AppDeploy CI credential exists; deployment automation requires validated documented API."
          else
            echo "::notice::AppDeploy CI credential absent. Automatic deployment is not enabled."
          fi
          echo "This workflow does not deploy or read production secrets."
